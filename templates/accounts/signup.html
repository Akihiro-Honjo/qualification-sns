{% extends "base.html" %}

{% block title %}
新規登録
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    ユーザー登録
                </h2>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-success w-100">

                        登録する

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
