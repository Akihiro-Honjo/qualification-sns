<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>
        {% block title %}
        Study Tracker
        {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="/">
            📚 Study Tracker
        </a>

        <div class="ms-auto">

            {% if user.is_authenticated %}

                <span class="text-white me-3">
                    👋 {{ user.username }} さん
                </span>
                
                <a
                href="{% url 'profile' %}"
                class="btn btn-outline-light me-2">
                マイページ
                </a>

                <a
                    href="{% url 'qualification_list' %}"
                    class="btn btn-outline-light me-2">
                    資格一覧
                </a>

                <form
                    action="{% url 'logout' %}"
                    method="post"
                    style="display:inline;">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-warning">

                        ログアウト

                    </button>

                </form>

            {% else %}

                <a
                    href="{% url 'login' %}"
                    class="btn btn-outline-light me-2">

                    ログイン

                </a>

                <a
                    href="{% url 'signup' %}"
                    class="btn btn-light">

                    新規登録

                </a>


            {% endif %}

        </div>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
